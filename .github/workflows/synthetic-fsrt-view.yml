name: Synthetic FSRT reader compile
on:
  pull_request:
    paths:
      - 'src/lib/notation/*fsrt*'
      - 'src/app/numerics/**'
      - 'scripts/check-simulated-fsrt-view.mjs'
      - '.github/workflows/synthetic-fsrt-view.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: node scripts/check-simulated-fsrt-view.mjs --compile-only
# Real provider/file/browser qualification runs in the composed own-RCI workflow.
