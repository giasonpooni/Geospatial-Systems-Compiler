name: Local RS scene specialist
on:
  pull_request:
    paths: ['tools/ciw-rs/**', '.github/workflows/rs-scene.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specialist:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/ciw-rs/requirements.txt
      - run: python -m pytest -q tools/ciw-rs/test_worker.py --junitxml=rs-tests.xml
      - run: python tools/ciw-rs/fixture.py --output-dir rs-evidence
      - name: Require every specialist test and retain exact source
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites=list(ET.parse('rs-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites)==38
          assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git archive --format=zip --output=rs-source.zip HEAD
          python -m pip freeze > rs-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-scene-${{ matrix.os }}
          if-no-files-found: error
          path: |
            rs-tests.xml
            rs-source.zip
            rs-environment.txt
            rs-evidence
